url: https://josueflorian17.github.io/drones4health-version-control/
template:
  bootstrap: 5
  light-switch: true
  includes:
    in_header: |
      <script>
        MathJax = {
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
          }
        };
      </script>
      <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

home:
  title: "drones4health: Ultra-High Resolution Drone Metrics for Spatial Health Analysis"
  description: "Extract micro-environmental and eco-epidemiological remote sensing metrics from UAV orthomosaics within a One Health framework."

navbar:
  title: "drones4health"
  left:
    - text: "Get Started"
      href: index.html
    - text: "Reference"
      href: reference/index.html
    - text: "Changelog"
      href: news/index.html
  right:
    - icon: fa-github fa-lg
      href: https://github.com/JosueFlorian17/drones4health-version-control
      aria-label: GitHub Repository

reference:
  - title: "Spectral Vegetation Indices & Land Cover Masks"
    desc: "Functions to calculate multispectral vegetation vigor, canopy chlorophyll, moisture accumulation, and binary bare soil substrate masks."
    contents:
      - d4h_ndvi
      - d4h_msavi2
      - d4h_savi
      - d4h_bare_soil
      - d4h_vari
      - d4h_ndre
      - d4h_gndvi
      - d4h_ndwi
      - d4h_evi
      - d4h_dvi
      - d4h_ctvi

  - title: "Micro-Terrain Topography & Hydrology"
    desc: "Elevation derivatives and terrain moisture modeling from UAV Digital Elevation Models (DEM/DSM)."
    contents:
      - d4h_slope
      - d4h_twi

  - title: "Eco-Epidemiological Risk Indices (One Health)"
    desc: "Spatial modeling of localized vector-borne disease transmission risks, solid waste micro-accumulation, and hydric breeding suitability."
    contents:
      - d4h_imsr
      - d4h_irhe
      - d4h_irih
      - d4h_irts
      - d4h_iev
      - d4h_iec
      - d4h_ifeb
      - d4h_iead

  - title: "Feature Segmentation & Spatial Proximity Risk"
    desc: "Automated object segmentation of water bodies and residential building footprints from ultra-high resolution RGB imagery, with Euclidean distance risk modeling."
    contents:
      - d4h_segment_water
      - d4h_segment_buildings
      - d4h_distance_to_risk
      - d4h_raster_distance

  - title: "Spatial Grids & Zonation"
    desc: "Operational surveillance grids (hexagons/squares) and zonal summary statistics extraction."
    contents:
      - d4h_hex_grid
      - d4h_summarize_grid
      - d4h_summarize_general
      - d4h_raster_general
      - d4h_summarize_global
      - d4h_global_summary

  - title: "Interactive Mapping & Cartography"
    desc: "Interactive swipe comparison viewers with dynamic contrast tuning and static publication-quality ggplot2 cartography."
    contents:
      - d4h_mapview_swipe
      - d4h_plot

  - title: "Executive Reporting & Excel Export"
    desc: "Multi-moment statistical summaries, Tukey outlier diagnostics, and direct multi-sheet Excel (.xlsx) workbook export."
    contents:
      - d4h_executive_summary
      - d4h_report
      - d4h_export_summary

  - title: "Preprocessing, Calibration & Utilities"
    desc: "Surface reflectance scaling, thermal calibration to Celsius Land Surface Temperature, raster cleaning, and batch mosaic workflows."
    contents:
      - d4h_normalize_reflectance
      - d4h_thermal_to_celsius
      - d4h_clean_band
      - d4h_process_mosaic
      - d4h_list_metrics
