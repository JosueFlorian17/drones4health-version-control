<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDVI vs Bare Soil Mask - Interactive Swipe Viewer</title>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="vignette_leaflet_slider_files/leaflet-1.3.1/leaflet.css" />
  <script src="vignette_leaflet_slider_files/leaflet-1.3.1/leaflet.js"></script>
  
  <!-- Leaflet Side-by-Side -->
  <script src="vignette_leaflet_slider_files/lfx-sidebyside-1.0.0/lfx-side-by-side.js"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111a21;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    #map {
      width: 100%;
      height: 100%;
      background: #0f171e;
    }
    
    /* Side-by-side divider line and handle styling */
    .leaflet-sbs-divider {
      background-color: #ffffff !important;
      width: 4px !important;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
    }
    
    .leaflet-sbs-range {
      position: absolute;
      top: 50%;
      width: 100%;
      z-index: 999;
      cursor: ew-resize;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script>
    var bounds = [[0, 0], [750, 900]];

    var map = L.map('map', {
      crs: L.CRS.Simple,
      minZoom: -1,
      maxZoom: 2,
      zoomSnap: 0.1,
      attributionControl: false,
      zoomControl: true
    });

    // Create custom panes for left and right layers
    map.createPane('leftPane');
    map.createPane('rightPane');

    // Layer 1: Bare Soil Mask (Right Layer)
    var soilLayer = L.imageOverlay('swipe_layer_bare_soil.png', bounds, {
      pane: 'rightPane'
    }).addTo(map);

    // Layer 2: NDVI Layer (Left Layer)
    var ndviLayer = L.imageOverlay('swipe_layer_ndvi.png', bounds, {
      pane: 'leftPane'
    }).addTo(map);

    // Fit map view to exact image dimensions
    map.fitBounds(bounds);

    // Initialize leaflet side-by-side controller
    var sideBySide = L.control.sideBySide(ndviLayer, soilLayer, {
      thumbSize: 42,
      padding: 0
    }).addTo(map);

    window.addEventListener('resize', function() {
      map.invalidateSize();
      map.fitBounds(bounds);
    });
  </script>
</body>
</html>
